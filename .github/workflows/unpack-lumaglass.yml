
name: Unpack LumaGlass Studio package

on:
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack LumaGlass package
        run: |
          test -f LumaGlass_Studio_Deploy_Package.zip
          unzip -o LumaGlass_Studio_Deploy_Package.zip -d .
          rm LumaGlass_Studio_Deploy_Package.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add LumaGlass Studio project files"
          git push
